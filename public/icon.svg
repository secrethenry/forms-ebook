<svg width="500" height="500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo preto -->
  <rect width="100" height="100" fill="#0D0D0D"/>
  <!-- Anel externo dourado -->
  <circle cx="50" cy="50" r="47" stroke="#C9A227" stroke-width="1.2" fill="none"/>
  <!-- Círculos internos do radar -->
  <circle cx="50" cy="50" r="36" stroke="#C9A227" stroke-width="0.8" fill="none" opacity="0.2"/>
  <circle cx="50" cy="50" r="26" stroke="#C9A227" stroke-width="0.8" fill="none" opacity="0.35"/>
  <circle cx="50" cy="50" r="17" stroke="#C9A227" stroke-width="1"   fill="none" opacity="0.58"/>
  <circle cx="50" cy="50" r="9"  stroke="#C9A227" stroke-width="1.2" fill="none" opacity="0.82"/>
  <!-- Eixos finos -->
  <line x1="50" y1="14" x2="50" y2="86" stroke="#C9A227" stroke-width="0.5" opacity="0.1"/>
  <line x1="14" y1="50" x2="86" y2="50" stroke="#C9A227" stroke-width="0.5" opacity="0.1"/>
  <!-- Linha de varredura -->
  <line x1="50" y1="50" x2="78" y2="22" stroke="#C9A227" stroke-width="1.8" opacity="0.88"/>
  <!-- Rastro da varredura -->
  <path d="M 74 26 A 34 34 0 0 0 50 16" stroke="#C9A227" stroke-width="1" fill="none" opacity="0.25"/>
  <!-- Centro vermelho -->
  <circle cx="50" cy="50" r="4"   fill="#8B0000"/>
  <circle cx="50" cy="50" r="1.8" fill="#CC2222"/>
  <!-- Sinal detectado -->
  <circle cx="73" cy="27" r="3.5" fill="#CC2222" opacity="0.92"/>
  <circle cx="73" cy="27" r="6"   stroke="#CC2222" stroke-width="0.8" fill="none" opacity="0.35"/>
</svg>
